<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Ingestion Interface</title>
    <style>
      body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f4f4f4;
}

.container {
    max-width: 800px;
    margin: auto;
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h1 {
    text-align: center;
    color: #333;
}

label {
    font-weight: bold;
}

input[type="text"], input[type="number"], input[type="file"] {
    width: 100%;
    padding: 8px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    padding: 10px 20px;
    margin: 10px 5px;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

#status-messages {
    margin-top: 20px;
    padding: 10px;
    background-color: #f1f1f1;
    border-radius: 4px;
    color: green;
}

#record-count {
    margin-top: 10px;
    padding: 10px;
    background-color: #e9e9e9;
    border-radius: 4px;
}

    </style>
</head>
<body>
    <h1>Data Ingestion Interface</h1>

    <label><input type="radio" name="source" value="clickhouse" checked> ClickHouse</label>
    <label><input type="radio" name="source" value="flatfile"> Flat File</label>

    <div id="clickhouse-form">
        <h2>ClickHouse Connection</h2>
        <input type="text" id="host" placeholder="Host">
        <input type="text" id="port" placeholder="Port">
        <input type="text" id="database" placeholder="Database">
        <input type="text" id="username" placeholder="Username">
        <input type="text" id="jwt" placeholder="JWT Token">
        <button onclick="connectClickHouse()">Connect</button>

        <select id="tableSelect"></select>
        <button onclick="loadSchema()">Load Schema</button>
        <button onclick="startIngestion()">Start Ingestion</button>
    </div>

    <div id="flatfile-form" style="display:none;">
        <h2>Flat File Upload</h2>
        <input type="file" id="fileInput">
        <input type="text" id="delimiter" placeholder="Delimiter (e.g. ,)">
        <button onclick="uploadFile()">Upload</button>
    </div>

    <p id="response"></p>

    <script src="/static/app.js"></script>
</body>
</html>
