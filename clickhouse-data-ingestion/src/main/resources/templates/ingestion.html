<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Data Ingestion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .preview-table {
            max-height: 400px;
            overflow-y: auto;
        }
        .progress {
            height: 25px;
        }
        .join-condition {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Data Ingestion</h1>
        
        <!-- Alert Messages -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <!-- ClickHouse to File -->
        <div class="card mb-4">
            <div class="card-header">
                <h5>Export from ClickHouse to File</h5>
            </div>
            <div class="card-body">
                <ul class="nav nav-tabs" id="exportTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="single-tab" data-bs-toggle="tab" 
                                data-bs-target="#single" type="button" role="tab">Single Table</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="join-tab" data-bs-toggle="tab" 
                                data-bs-target="#join" type="button" role="tab">Multi-Table Join</button>
                    </li>
                </ul>
                <div class="tab-content mt-3" id="exportTabContent">
                    <!-- Single Table Export -->
                    <div class="tab-pane fade show active" id="single" role="tabpanel">
                        <form th:action="@{/ingestion/clickhouse-to-file}" method="post">
                            <div class="mb-3">
                                <label for="tableName" class="form-label">Table Name</label>
                                <input type="text" class="form-control" id="tableName" name="tableName" required>
                            </div>
                            <div class="mb-3">
                                <label for="columns" class="form-label">Columns (comma-separated)</label>
                                <input type="text" class="form-control" id="columns" name="columns" required>
                            </div>
                            <div class="mb-3">
                                <label for="fileFormat" class="form-label">File Format</label>
                                <select class="form-select" id="fileFormat" name="fileFormat" required>
                                    <option value="csv">CSV</option>
                                    <option value="json">JSON</option>
                                </select>
                            </div>
                            <button type="button" class="btn btn-secondary me-2" onclick="previewData()">Preview Data</button>
                            <button type="submit" class="btn btn-primary">Export</button>
                        </form>
                    </div>
                    <!-- Multi-Table Join Export -->
                    <div class="tab-pane fade" id="join" role="tabpanel">
                        <form th:action="@{/ingestion/clickhouse-to-file/join}" method="post">
                            <div class="mb-3">
                                <label for="tableNames" class="form-label">Table Names (comma-separated)</label>
                                <input type="text" class="form-control" id="tableNames" name="tableNames" required>
                            </div>
                            <div class="mb-3">
                                <label for="joinColumns" class="form-label">Columns (comma-separated)</label>
                                <input type="text" class="form-control" id="joinColumns" name="columns" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Join Conditions</label>
                                <div id="joinConditions">
                                    <div class="join-condition">
                                        <input type="text" class="form-control" name="joinConditions" 
                                               placeholder="e.g., table1.column = table2.column" required>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-secondary mt-2" onclick="addJoinCondition()">
                                    Add Join Condition
                                </button>
                            </div>
                            <div class="mb-3">
                                <label for="joinFileFormat" class="form-label">File Format</label>
                                <select class="form-select" id="joinFileFormat" name="fileFormat" required>
                                    <option value="csv">CSV</option>
                                    <option value="json">JSON</option>
                                </select>
                            </div>
                            <button type="button" class="btn btn-secondary me-2" onclick="previewJoinData()">Preview Data</button>
                            <button type="submit" class="btn btn-primary">Export</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Data Preview Modal -->
        <div class="modal fade" id="previewModal" tabindex="-1">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Data Preview</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="preview-table">
                            <table class="table table-striped">
                                <thead id="previewHeader"></thead>
                                <tbody id="previewBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- File to ClickHouse -->
        <div class="card">
            <div class="card-header">
                <h5>Import from File to ClickHouse</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/ingestion/file-to-clickhouse}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">File</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                    </div>
                    <div class="mb-3">
                        <label for="importTableName" class="form-label">Table Name</label>
                        <input type="text" class="form-control" id="importTableName" name="tableName" required>
                    </div>
                    <div class="mb-3">
                        <label for="importColumns" class="form-label">Columns (comma-separated)</label>
                        <input type="text" class="form-control" id="importColumns" name="columns" required>
                    </div>
                    <div class="progress mb-3 d-none" id="importProgress">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Import</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Join condition management
        function addJoinCondition() {
            const container = document.getElementById('joinConditions');
            const div = document.createElement('div');
            div.className = 'join-condition';
            div.innerHTML = `
                <div class="input-group">
                    <input type="text" class="form-control" name="joinConditions" 
                           placeholder="e.g., table1.column = table2.column" required>
                    <button type="button" class="btn btn-danger" onclick="this.parentElement.parentElement.remove()">
                        Remove
                    </button>
                </div>
            `;
            container.appendChild(div);
        }

        // Data preview functions
        function previewData() {
            const tableName = document.getElementById('tableName').value;
            const columns = document.getElementById('columns').value;
            
            fetch(`/ingestion/preview?tableName=${tableName}&columns=${columns}`)
                .then(response => response.json())
                .then(data => showPreview(data))
                .catch(error => alert('Error during preview: ' + error));
        }

        function previewJoinData() {
            const tableNames = document.getElementById('tableNames').value;
            const columns = document.getElementById('joinColumns').value;
            const joinConditions = Array.from(document.getElementsByName('joinConditions'))
                .map(input => input.value)
                .join(';');
            
            fetch(`/ingestion/preview/join?tableNames=${tableNames}&columns=${columns}&joinConditions=${joinConditions}`)
                .then(response => response.json())
                .then(data => showPreview(data))
                .catch(error => alert('Error during preview: ' + error));
        }

        function showPreview(data) {
            const header = document.getElementById('previewHeader');
            const body = document.getElementById('previewBody');
            
            // Clear previous content
            header.innerHTML = '';
            body.innerHTML = '';
            
            if (data.length === 0) {
                body.innerHTML = '<tr><td colspan="100%" class="text-center">No data available</td></tr>';
                return;
            }
            
            // Create header
            const headerRow = document.createElement('tr');
            Object.keys(data[0]).forEach(key => {
                const th = document.createElement('th');
                th.textContent = key;
                headerRow.appendChild(th);
            });
            header.appendChild(headerRow);
            
            // Create rows
            data.forEach(row => {
                const tr = document.createElement('tr');
                Object.values(row).forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value;
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
            
            // Show modal
            new bootstrap.Modal(document.getElementById('previewModal')).show();
        }

        // Import progress
        document.querySelector('form[enctype="multipart/form-data"]').addEventListener('submit', function(e) {
            const progress = document.getElementById('importProgress');
            progress.classList.remove('d-none');
            
            const xhr = new XMLHttpRequest();
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percent = (e.loaded / e.total) * 100;
                    progress.querySelector('.progress-bar').style.width = percent + '%';
                }
            });
            
            xhr.open('POST', this.action, true);
            xhr.send(new FormData(this));
        });
    </script>
</body>
</html>
